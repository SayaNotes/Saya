name: Saya Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.0.1

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble Saya debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out Saya
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 ndk;27.0.12077973 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Saya-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
